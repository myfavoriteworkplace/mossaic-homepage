<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mossaic — The future, assembled. Modular, India-first SaaS with explainable AI at its core. From dental practice management to retail CRM and AI imaging."
    />
    <meta name="theme-color" content="#0A1628" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mossaic — The future, assembled" />
    <meta
      property="og:description"
      content="Modular, India-first SaaS with explainable AI at its core. From dental practice management to retail CRM and AI imaging."
    />
    <meta property="og:site_name" content="Mossaic" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mossaic — The future, assembled" />
    <meta
      name="twitter:description"
      content="Modular, India-first SaaS with explainable AI at its core. From dental practice management to retail CRM and AI imaging."
    />

    <title>Mossaic — The future, assembled</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mossaic-theme");
          // Migrate legacy stored value
          if (stored === "dark") stored = "aurora";
          var valid = { aurora: 1, light: 1, moss: 1, mono: 1 };
          var theme = stored && valid[stored] ? stored : "aurora";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "aurora");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
