# One-click Render Static Site deployment
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mossaic-homepage
    runtime: static
    buildCommand: node --version && npm --version && npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /deck
        destination: /deck/index.html
      - type: rewrite
        source: /deck/*
        destination: /deck/index.html
      - type: rewrite
        source: /*
        destination: /index.html
